name: Validate and publish Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Check browser modules
        run: |
          node --check app.js
          node --check worker.js
          node --check modes.js
          node --check beam.js
          node --check theory.js
          node --test tests/*.test.mjs
      - name: Check scientific calculations and input boundaries
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build static application
        run: node scripts/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: validate-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
